# Databricks App config. Must live at the ROOT of the deployed source folder.
# The runtime auto-injects host/port (DATABRICKS_APP_PORT), so no --server.port
# is needed. Attach the `data-on-tap` Lakebase instance as an app resource so
# the app can connect at runtime.
command:
  - streamlit
  - run
  - streamlit_app/app.py
